[package]
name = "rush"
version = "0.3.0-alpha"
edition = "2021"
description = "rush: remote terminal over websockets. A zero-dependency Rust rewrite of the ush.py concept, for Linux and Windows."
license = "MIT"

[[bin]]
name = "rush"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
