name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    tags:
      - "v*"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: rename binary
        run: cp target/release/rush rush-linux
      - uses: actions/upload-artifact@v4
        with:
          name: rush-linux
          path: rush-linux

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: rename binary
        shell: bash
        run: cp target/release/rush.exe rush.exe
      - uses: actions/upload-artifact@v4
        with:
          name: rush.exe
          path: rush.exe

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rush-linux
      - uses: actions/download-artifact@v4
        with:
          name: rush.exe
      - name: checksums
        run: sha256sum rush-linux rush.exe > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          body: |
            rush ${{ github.ref_name }}

            rush-linux: Linux x86_64 server + client.
            rush.exe: Windows x86_64 client.

            Install on Linux:

                curl -fL https://github.com/FolderFile/rush/releases/latest/download/install.sh | bash

            rush -s -p 8080            run the server (Linux)
            rush host -p 8080          connect (Linux/Windows)
            rush host -e CMD           run one command, exit with its status
            rush --update              update the installed binary
            rush --uninstall           remove binary and service

            Same wire protocol as ush.py v4.0. Optional shared token (-k / RUSH_KEY); see README.
          files: |
            rush-linux
            rush.exe
            install.sh
            SHA256SUMS
