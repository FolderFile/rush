name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    tags:
      - "v*"

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: rename binary
        run: cp target/x86_64-unknown-linux-musl/release/rush rush-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: rush-linux-x86_64
          path: rush-linux-x86_64

  linux-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: install cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo build --release --locked --target aarch64-unknown-linux-musl
      - name: rename binary
        run: cp target/aarch64-unknown-linux-musl/release/rush rush-linux-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: rush-linux-aarch64
          path: rush-linux-aarch64

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: rename binary
        shell: bash
        run: cp target/release/rush.exe rush.exe
      - uses: actions/upload-artifact@v4
        with:
          name: rush.exe
          path: rush.exe

  publish:
    needs: [linux-x86_64, linux-aarch64, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rush-linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: rush-linux-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: rush.exe
      - name: checksums
        run: sha256sum rush-linux-x86_64 rush-linux-aarch64 rush.exe > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          body: |
            rush ${{ github.ref_name }}

            - rush-linux-x86_64: static musl build, runs on any 64-bit intel/amd linux
            - rush-linux-aarch64: static musl build for arm64, including Termux with glibc-compatible setups, raspberry pi 4/5 and arm servers
            - rush.exe: windows client

            install: curl -fL https://github.com/FolderFile/rush/releases/latest/download/install.sh | bash
